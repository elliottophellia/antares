# Hot-reload config for the TUI preview.
# Run:  air -c .air.tui.toml   (edit internal/tui/*.go and the view reloads)
root = "."
tmp_dir = ".air"

[build]
  cmd = "GOTOOLCHAIN=local $HOME/.local/sdk/go/bin/go build -o ./.air/tuidemo ./cmd/tuidemo"
  bin = "./.air/tuidemo"
  full_bin = "./.air/tuidemo"
  include_ext = ["go"]
  include_dir = ["internal/tui", "cmd/tuidemo"]
  exclude_dir = [".air", "web", "node_modules", ".git", "internal/server/dist"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  kill_delay = "800ms"
  send_interrupt = true

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = true
